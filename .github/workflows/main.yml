name: Build Newaye APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Check Android and Gradle environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "PATH=$PATH"
          echo "---- sdkmanager ----"
          which sdkmanager || true
          echo "---- gradle ----"
          which gradle || true
          echo "---- Java ----"
          java -version
          echo "---- Gradle ----"
          gradle --version

      - name: Install Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          echo "Using SDK: $SDK"
          which sdkmanager
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Prepare persistent Android debug signing key
        env:
          NEWAYE_DEBUG_KEYSTORE_BASE64: ${{ secrets.NEWAYE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$NEWAYE_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$NEWAYE_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "KEY_SOURCE=secret" >> "$GITHUB_ENV"
            echo "Loaded the persistent signing key from GitHub Secrets."
          else
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Newaye Development,O=Newaye,C=ET"
            echo "KEY_SOURCE=generated" >> "$GITHUB_ENV"
            echo "Created a first-run signing key. Save it from the workflow artifact and add it to GitHub Secrets before future builds."
          fi

      - name: Build Newaye APK
        run: |
          gradle --no-daemon assembleDebug
      - name: Run Milestone 4 unit tests
        run: |
          gradle --no-daemon testDebugUnitTest
      - name: Upload Newaye APK
        uses: actions/upload-artifact@v4
        with:
          name: Newaye-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Export first-run signing key for GitHub Secret setup
        if: env.KEY_SOURCE == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: Newaye-debug-signing-key-ONE-TIME-SETUP
          path: /home/runner/.android/debug.keystore
          retention-days: 7
